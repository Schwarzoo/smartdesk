# fly.toml app configuration file generated for server-restless-star-9200 on 2026-03-24T17:24:27+01:00

app = 'server-restless-star-9200'
primary_region = 'fra'

[build]

[mounts]
  source = 'smartdesk_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[checks]
  [checks.health]
    grace_period = "5s"
    interval = "10s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "2s"
    type = "http"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024